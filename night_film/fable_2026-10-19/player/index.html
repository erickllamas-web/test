<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Your Birthday Sky — Mexico City, 2 April 1983</title>
<!--
  THE PLAYER.
  ===========================================================================
  Nothing here renders the sky. Both films were baked on the metal; this page
  plays finished video and answers questions ABOUT the frame on screen.

  It needs no wasm. `film.json` records, per frame, the exact camera and sky
  state that frame was rendered with; `sky.json` carries the 3,212 named stars
  as J2000 RA/dec. Between them a dozen lines of arithmetic turn any star into
  the pixel it occupies right now — which is all a tap or a reticle ever needs.
  The heavy renderer stays where it belongs: at bake time.

  Two films, one director:
    film.mp4   the cinematic cut — sunrise, sunset, night. What you WATCH.
    night.mp4  the planetarium pass — sunlight off, clock uniform so every
               right ascension gets equal screen time. What you SEARCH.
-->
<style>
  :root {
    color-scheme: dark;
    --ink:#e7ebf2; --dim:#8b93a3; --faint:#5d6473;
    --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
    --gold:#ffd479; --glass:rgba(10,13,20,.72);
    --r:14px;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#000; overflow:hidden;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--ink); -webkit-font-smoothing:antialiased; touch-action:manipulation; }

  /* ── the stage ─────────────────────────────────────────────────────────────
     #frame is sized in JS to EXACTLY the rectangle `object-fit:cover` would
     have given the video — same 16:9 as the render, scaled to cover, centred.
     Doing it explicitly buys two things the shorthand could not:

       · the overlay canvas becomes the video's own pixel grid, so a tap and a
         reticle are computed in the same 1280×720 space the renderer painted
         in. With `cover` on the viewport the page had to guess that mapping,
         and guessed the VIEWPORT aspect — which only agrees with the renderer
         when the window happens to be narrower than 16:9.
       · #stage can be translated and scaled to bring a chosen star to the
         middle of the screen without any of the chrome moving with it.

     No `overflow:hidden` here, deliberately. An overflow clip is applied in the
     element's OWN coordinate space and only then transformed — so clipping the
     stage to the viewport and afterwards panning it would scale up an
     already-cropped picture and let black in at the edge. `body` clips instead,
     untransformed, which is where a clip actually belongs. */
  #stage { position:fixed; inset:0; z-index:0;
    transform-origin:50% 50%; will-change:transform; }
  #frame { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); }
  video { position:absolute; inset:0; width:100%; height:100%; display:block;
    background:#000; transition:opacity .45s ease; }
  video.off { opacity:0; pointer-events:none; }
  #overlay { position:absolute; inset:0; width:100%; height:100%; z-index:2;
    pointer-events:none; }
  /* ── the veil ──────────────────────────────────────────────────────────────
     One black sheet over the whole stage, under the chrome. It is what the
     film comes up out of at the start and dips through at the loop point, and
     its alpha is driven from the video's own clock in tick(), never from a
     CSS animation — so it stays in step with a frame that arrives late, and
     lifts the moment the first frame has actually been painted. */
  #veil { position:fixed; inset:0; background:#000; z-index:4;
    pointer-events:none; opacity:1; }
  /* The cut fading IN during a Sun switch sits above the one it replaces.
     A class, not a DOM move: re-inserting a <video> makes it reload. */
  video.top { z-index:1; }
  #tapzone { position:absolute; inset:0; z-index:1; cursor:crosshair; }

  /* ── the panel ─────────────────────────────────────────────────────────────
     One card, not five. The search field is the entire resting state; results,
     the object card and the transport are hairline-separated sections of the
     SAME surface, so nothing announces itself until it has something to say.
     There is no title bar — the caption bottom-left already says whose sky this
     is, and saying it twice was the least minimal thing on screen. */
  #panel { position:fixed; z-index:5; left:20px; top:20px; width:296px;
    max-width:calc(100vw - 40px); }

  .glass { background:var(--glass); backdrop-filter:blur(20px) saturate(1.3);
    -webkit-backdrop-filter:blur(20px) saturate(1.3);
    border:1px solid var(--line); border-radius:var(--r);
    box-shadow:0 8px 34px rgba(0,0,0,.55); overflow:hidden; }

  /* Every glyph control on the panel is the same button: no chrome, no box,
     just the mark. They differ only in what they draw. */
  .ic { background:none; border:0; color:var(--faint); cursor:pointer;
    line-height:1; padding:2px 3px; flex:none; font-size:15px;
    transition:color .2s ease, transform .3s ease; }
  .ic:hover { color:var(--ink); }
  .ic svg, #info .x svg { display:block; }
  #panel.closed #head { transform:rotate(-90deg); }

  #body { max-height:78vh;
    transition:max-height .35s ease, opacity .25s ease; }
  #panel.closed #body { max-height:0; opacity:0; overflow:hidden;
    pointer-events:none; }

  /* One hairline between sections is the only separator in the whole panel. */
  #res, #info, #tr { border-top:1px solid var(--line); }

  /* search */
  #sbox { display:flex; align-items:center; gap:9px; padding:0 12px; }
  #sbox svg { flex:none; opacity:.4; }
  #q { flex:1; background:transparent; border:0; outline:0; color:var(--ink);
    font:14px/44px inherit; min-width:0; }
  #q::placeholder { color:var(--faint); }
  #q::-webkit-search-cancel-button { display:none; }
  #xq { display:none; font-size:17px; }

  /* No `display:none` here on purpose: the list is revealed with
     `style.display=''`, which falls back to this rule — so hiding it in CSS
     would mean it could never be shown again. The initial hide is inline. */
  #res { overflow-y:auto; max-height:38vh; scrollbar-width:thin; }
  .row { display:flex; align-items:center; gap:10px; padding:8px 12px;
    cursor:pointer; }
  .row + .row { border-top:1px solid rgba(255,255,255,.05); }
  .row:hover,.row.sel { background:rgba(255,212,121,.09); }
  .row .nm { flex:1; font-size:13.5px; min-width:0; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  .row .sub { font-size:9.5px; color:var(--dim); letter-spacing:.09em;
    text-transform:uppercase; flex:none; }
  .row .tt { font:10.5px ui-monospace,monospace; color:var(--faint); flex:none; }
  .row.unreach .nm { color:#7d8496; }
  .note { padding:10px 12px; font-size:12px; color:var(--dim); line-height:1.45; }

  /* the object card — a name, what it is, and the numbers. Nothing else. */
  #info { padding:12px; display:none; }
  #info.on { display:block; }
  #info .n { font-size:18px; font-weight:600; }
  #info .d { font-size:11.5px; color:var(--dim); margin:1px 0 9px; }
  #info dl { display:grid; grid-template-columns:auto 1fr; gap:3px 14px;
    margin:0; font:11.5px/1.45 ui-monospace,monospace; }
  #info dt { color:var(--faint); }
  #info dd { margin:0; text-align:right; }
  #info .x { float:right; color:var(--faint); cursor:pointer; font-size:16px;
    line-height:1; margin:-2px -2px 0 0; }
  #info .x:hover { color:var(--ink); }
  #info table.pt { width:100%; margin-top:10px; border-collapse:collapse;
    font:11.5px/1.5 ui-monospace,monospace; }
  #info table.pt th { color:var(--faint); font-weight:400; text-align:right; }
  #info table.pt td { text-align:right; }
  #info table.pt td:first-child { text-align:left; color:var(--dim);
    font-family:ui-sans-serif,system-ui,sans-serif; }

  /* transport — play, position, clock, sun. One row, four marks, no boxes.
     The sun was a labelled switch with a sentence under it; the glyph says the
     same thing, and the picture behind it says it better than either. */
  #tr { display:flex; align-items:center; gap:10px; padding:7px 12px; }
  #scrub { flex:1; accent-color:var(--gold); height:3px; min-width:0; }
  #clk { font:10.5px ui-monospace,monospace; color:var(--dim); flex:none; }
  #sun.lit { color:var(--gold); }

  /* caption + title */
  #cap { position:fixed; left:24px; bottom:26px; z-index:3; pointer-events:none;
    text-shadow:0 1px 12px #000; transition:opacity 1s ease; }
  #cap .p { font-size:19px; font-weight:600; letter-spacing:.22em; }
  #cap .d { font-size:12.5px; color:#aeb4c2; letter-spacing:.13em; margin-top:5px; }
  #cap.hide { opacity:0; }

  #toast { position:fixed; left:50%; top:26px; transform:translateX(-50%);
    z-index:6; padding:9px 16px; border-radius:999px; font-size:13px;
    background:var(--glass); border:1px solid var(--line);
    backdrop-filter:blur(20px); opacity:0; transition:opacity .3s;
    pointer-events:none; white-space:nowrap; }
  #toast.on { opacity:1; }

  @media (max-width:760px) {
    #panel { left:10px; right:10px; top:10px; width:auto; }
    #res { max-height:32vh; }
    #cap { left:14px; bottom:16px; }
    #cap .p { font-size:15px; }
  }
</style>
</head>
<body>
  <!-- Both films stay loaded so the Sun switch is instant, not a re-buffer. -->
  <div id="stage"><div id="frame">
    <!-- The sources are chosen at boot: one pair per screen shape for a square
         master, or film.mp4 / night.mp4 for a plain bake. -->
    <video id="vFilm"  playsinline loop muted preload="auto"></video>
    <video id="vNight" class="off" playsinline loop muted preload="auto"></video>
    <div id="tapzone"></div>
    <canvas id="overlay"></canvas>
  </div></div>

  <!-- The bundler stamps the customer's place and date into these two nodes.
       They carry IDs purely so that stamp has something unique to aim at:
       `class="p"` and `class="d"` are also used by the info card's markup down
       in the script, and a sed keyed on the class rewrote BOTH — every card in
       the film then announced itself as "4 SEPTEMBER 2026" instead of "Planet".
       An ID appears once in the document, so the stamp cannot spread. -->
  <div id="cap">
    <div class="p" id="capPlace">MEXICO CITY</div>
    <div class="d" id="capDate">2 APRIL 1983 · 10:05</div>
  </div>

  <div id="panel">
    <div class="glass">
      <div id="sbox">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>
        </svg>
        <input id="q" type="search" autocomplete="off" spellcheck="false"
               placeholder="Orion, Sirius, the swan…">
        <button id="xq" class="ic" aria-label="clear" data-icon="close"></button>
        <button id="head" class="ic" aria-label="collapse" data-icon="chev"></button>
      </div>

      <div id="body">
        <div id="res" style="display:none"></div>
        <div id="info"></div>
        <div id="tr">
          <button id="pp" class="ic" aria-label="play or pause" data-icon="pause"></button>
          <input id="scrub" type="range" min="0" max="1000" value="0">
          <span id="clk">0:00</span>
          <button id="sun" class="ic lit" aria-label="sunlight" title="Sunlight on — the day as it was" data-icon="sun"></button>
          <button id="dayb" class="ic" aria-label="the day" title="The day at this place" data-icon="day" style="display:none"></button>
        </div>
      </div>
    </div>
  </div>

  <div id="veil"></div>
  <div id="toast"></div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const D2R = Math.PI / 180, R2D = 180 / Math.PI;

// Every control is a drawn icon, never a text character. A character is only a
// request for a glyph: ☀ and ☾ come back as colour emoji on many phones, and
// ❚❚ ▶ ▾ × change weight and baseline with whatever font the device has.
const ICON = (() => {
  const s = (body, fill) => `<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" `
    + (fill ? `fill="currentColor" stroke="none">` : `fill="none" stroke="currentColor" `
    + `stroke-width="2" stroke-linecap="round" stroke-linejoin="round">`) + body + `</svg>`;
  return {
    play:  s('<path d="M8 5.5v13l10.5-6.5z"/>', true),
    pause: s('<rect x="6.5" y="5" width="4" height="14" rx="1"/><rect x="13.5" y="5" width="4" height="14" rx="1"/>', true),
    sun:   s('<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2'
           + 'M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/>'),
    moon:  s('<path d="M20 14.5A8 8 0 1 1 9.5 4a6.3 6.3 0 0 0 10.5 10.5z"/>'),
    chev:  s('<path d="M6 9l6 6 6-6"/>'),
    close: s('<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>'),
    day:   s('<path d="M3 17h18M6 13a6 6 0 0 1 12 0M12 4v2.5M4.6 7.6l1.7 1.7M19.4 7.6l-1.7 1.7M8 21h8"/>'),
  };
})();
function setIcon(el, name){ el.innerHTML = ICON[name]; el.dataset.icon = name; }
document.querySelectorAll('[data-icon]').forEach(el => setIcon(el, el.dataset.icon));

// `let`, not `const`: a shape swap brings the new cut in on a NEW element and
// retires the old one, so these two names are rebound (see applyShape).
let vFilm = $('vFilm'), vNight = $('vNight');
const ov = $('overlay'), octx = ov.getContext('2d');
const stage = $('stage'), frame = $('frame');

// ── state ────────────────────────────────────────────────────────────────────
const S = {
  film: null,     // sidecar of the cinematic cut
  night: null,    // sidecar of the planetarium pass
  seek: null,     // seek index, built on the planetarium pass
  sky: null,      // named-star table
  fig: null,      // Rey stick figures, by IAU code
  sunOff: false,  // which film is on screen
  marked: null,   // {ra,dec,name} to keep a reticle on
  figure: null,   // {code,name,seg} — the figure currently drawn over the sky
  look: null,     // {az,alt} — free-look direction, or null to just play
  aim: null,      // per-frame aim unit vectors of the planetarium pass
  shape: null,    // which screen shape of a square master is on screen
  crop: 1,        // that shape's height over the master's
  switching: 0,   // >0 while the Sun switch waits for its destination frame
  pending: null,  // a shape swap in flight: {k, token}
  staging: { film: null, night: null },   // a cut being brought in for a new shape
  // Video-pixel geometry, recomputed on resize. Wn×Hn is the RENDER size read
  // from the sidecar, never hardcoded; s is the cover scale.
  Wn: 1280, Hn: 720, s: 1,
  // Where the stage is, and where it is heading. Held apart so the camera
  // eases into a lock instead of snapping to it. See lockStage().
  tx:0, ty:0, tz:1, gx:0, gy:0, gz:1,
};
const vid  = () => S.sunOff ? vNight : vFilm;
const side = () => S.sunOff ? S.night : S.film;

// ── the projection ───────────────────────────────────────────────────────────
// A direct port of babel_productions::sky. It MUST agree with the renderer that
// painted the frame, or a tap would name a star that is not under the finger.
const cross = (a,b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const dot   = (a,b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
function norm(v){ const m = Math.hypot(v[0],v[1],v[2]); return m<1e-12 ? v : [v[0]/m,v[1]/m,v[2]/m]; }

function dirAltaz(azDeg, altDeg){
  const a = azDeg*D2R, e = altDeg*D2R;
  return [Math.sin(a)*Math.cos(e), Math.sin(e), Math.cos(a)*Math.cos(e)];
}

// The renderer builds its half-angle through DTrig: it quantises tan(fov/4) to
// 1e-5 and then doubles the angle algebraically, tan(2θ)=2t/(1−t²). Reproducing
// the quantisation matters — skipping it shifts stars a fraction of a pixel and
// makes the reticle disagree with the picture near the frame edge.
function cameraBasis(azDeg, altDeg, fovDeg){
  const fwd = norm(dirAltaz(azDeg, altDeg));
  const right = norm(cross([0,1,0], fwd));
  const up = cross(fwd, right);
  const t = Math.round(Math.tan(fovDeg*D2R*0.25)*1e5)/1e5;
  // `S.crop` is this screen shape's height over the square master's: a centred
  // crop is the same camera with its half-field tangent scaled by exactly that.
  return { right, up, fwd, half: 2*t/(1-t*t) * (S.crop || 1) };
}

// `loose` keeps points that fall outside the frame. A reticle wants them
// rejected — there is nothing on screen to ring. A stick figure wants them
// kept, because a constellation half out of shot should still draw the half
// that is in shot; dropping a segment because one endpoint is over the edge
// would amputate the figure instead of clipping it.
function projectDir(v, cb, w, h, loose){
  const cz = dot(v, cb.fwd);
  if (cz <= 1e-4) return null;                     // behind the camera
  const nx = dot(v, cb.right)/cz/(cb.half*(w/h));
  const ny = dot(v, cb.up)/cz/cb.half;
  if (!loose && (Math.abs(nx) > 1 || Math.abs(ny) > 1)) return null;
  return [ (nx+1)*0.5*w - 0.5, (1-ny)*0.5*h - 0.5 ];
}

function radecToAltaz(raDeg, decDeg, latDeg, lstDeg){
  const ha = (lstDeg-raDeg)*D2R, dec = decDeg*D2R, lat = latDeg*D2R;
  const sd=Math.sin(dec), cd=Math.cos(dec), sl=Math.sin(lat), cl=Math.cos(lat),
        sh=Math.sin(ha),  ch=Math.cos(ha);
  const alt = Math.asin(Math.max(-1, Math.min(1, sd*sl + cd*cl*ch)));
  let az = Math.atan2(-cd*sh, sd*cl - cd*sl*ch)*R2D;
  if (az < 0) az += 360;
  return [az, alt*R2D];
}

// ── seeking, one at a time ──────────────────────────────────────────────────
// A <video> honours the LAST currentTime it was given and throws the seeks in
// between away — so a fly-to that writes a new time every animation frame, or
// a drag that writes one per pointer move, asks a 4K decoder for sixty seeks a
// second and gets a handful of frames, each after a stall. Issuing the next
// seek only when the previous one has LANDED bounds the queue to one: every
// frame the decoder finishes is a frame on screen, and the move reads as
// motion instead of a stutter. The target is always the latest one asked for.
function seekTo(v, t){
  if (v.seeking){ v._pend = t; return; }
  v._pend = null;
  v.currentTime = t;
}
function armSeeks(v){
  v.addEventListener('seeked', () => {
    if (v._pend != null){ const t = v._pend; v._pend = null; v.currentTime = t; }
  });
}
// Resolves once `v` has landed on `t` and PAINTED that frame (a decoded frame
// is not yet a composited one under 4K load — the seam harness caught the
// destination at partial opacity with a stale picture behind it), or after `ms`.
function seekAndWait(v, t, ms){
  return new Promise(res => {
    let done = false;
    const fin = () => { if (done) return; done = true; clearTimeout(h);
      v.removeEventListener('seeked', onS); res(); };
    const painted = () => {
      if (!v.requestVideoFrameCallback) return fin();
      const g = setTimeout(fin, 400);              // a frame that never comes must not hold the switch
      v.requestVideoFrameCallback(() => { clearTimeout(g); fin(); });
    };
    const onS = () => { if (v.readyState >= 2) painted(); else v.addEventListener('canplay', painted, { once:true }); };
    const h = setTimeout(fin, ms);
    v.addEventListener('seeked', onS);
    v._pend = null;
    v.currentTime = t;
  });
}

// ── frame lookup ─────────────────────────────────────────────────────────────
function frameIdx(f, t){ return Math.max(0, Math.min(f.frames-1, Math.round(t*f.fps))); }

function camNow(){
  const f = side(), v = vid(), k = frameIdx(f, v.currentTime);
  return { f, k, lat:f.lat,
           az:f.aim_az[k], alt:f.aim_alt[k], fov:f.fov[k],
           lst:f.lst[k], sun:f.sun_alt[k], maglim:f.maglim[k], sample:f.sample[k] };
}

// ── the sun switch ───────────────────────────────────────────────────────────
// Switching films keeps you on the SAME MOMENT of sky, not the same timestamp.
// The two cuts run different clocks, so the honest bridge is the daemon sample:
// find the frame in the other film that shows the same sample.
function timeForSample(f, sample){
  let bi = 0, bd = Infinity;
  for (let i = 0; i < f.frames; i++){
    const d = Math.abs(f.sample[i]-sample);
    if (d < bd){ bd = d; bi = i; if (!d) break; }
  }
  return bi / f.fps;
}

function setSun(off, keepTime){
  if (off === S.sunOff) return;
  const from = side(), fromV = vid(), sample = from.sample[frameIdx(from, fromV.currentTime)];
  S.sunOff = off;
  const to = side(), toV = vid();
  const target = keepTime != null ? keepTime : timeForSample(to, sample);
  const playing = !fromV.paused;
  // The picture that is up stays up, frozen on its last frame, until the other
  // cut has actually decoded the frame it was asked for. Only then does the
  // destination fade in ON TOP of it. Two things this buys over fading both at
  // once: the switch never shows the frame the other cut happened to be parked
  // on (seeking a 4K file takes real time, and the old code started its
  // dissolve before the seek had landed), and the screen never darkens in the
  // middle — two half-transparent layers over black add up to three quarters
  // of the light, which read as a blink on every switch.
  fromV.pause();
  const token = ++S.switching;
  // If the destination cut is still being brought in for a new shape, wait
  // for that first: the element to seek is the one that will be on screen.
  const staged = S.staging[off ? 'night' : 'film'] || Promise.resolve();
  staged.then(() => { const toV = vid(); return seekAndWait(toV, target, 2500).then(() => toV); }).then(toV => {
    if (token !== S.switching) return;            // a newer switch superseded this one
    const fromV = off ? vFilm : vNight;             // re-read: a swap may have replaced it
    fromV.classList.remove('top'); toV.classList.add('top');   // paint the newcomer on top
    toV.classList.remove('off');
    if (playing && toV === vid()) toV.play().catch(()=>{});
    const retire = () => { S.switching = 0; if (toV === vid()) fromV.classList.add('off'); syncScrub(); };
    toV.addEventListener('transitionend', retire, { once:true });
    setTimeout(retire, 600);                        // in case the transition never fires
  });
  // Sun on, the glyph is a lit sun; sun off, it is the moon. The picture behind
  // it explains the rest better than a caption ever did.
  const sw = $('sun');
  setIcon(sw, off ? 'moon' : 'sun');
  sw.classList.toggle('lit', !off);
  sw.title = off ? 'Sunlight off — the whole sphere' : 'Sunlight on — the day as it was';
  syncScrub();
}
$('sun').onclick = () => setSun(!S.sunOff);

// ── search ───────────────────────────────────────────────────────────────────
// Constellation aliases so plain English works: "the swan" finds Cygnus.
let CON_EN = {};
function norml(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,' ').trim(); }

function searchIndex(query, limit){
  const q = norml(query);
  if (!q) return [];
  const out = [];
  for (const e of S.seek){
    const nm = norml(e.name), con = norml(e.con), en = norml(CON_EN[e.con] || '');
    let sc = -1;
    if (nm === q || con === q || en === q) sc = 100;
    else if (nm.startsWith(q) || en.startsWith(q)) sc = 80;
    else if (nm.includes(q) || en.includes(q)) sc = 55;
    else if (e.bf && norml(e.bf).includes(q)) sc = 40;
    if (sc < 0) continue;
    // Constellations outrank single stars, then brightness, then reachability.
    //
    // The Sun, the Moon and the planets outrank both. Someone typing "Mars" or
    // "Moon" wants the body, and there is exactly one of each — nothing is
    // buried by promoting them.
    //
    // Their `mag` key is ABSENT, not zero: the Sun and the Moon reach this
    // pipeline without a magnitude, so the baker omits the key rather than
    // inventing a textbook number. `Math.max(0, undefined)` is NaN, and NaN
    // propagates through the sum — every body would sort last, silently. Hence
    // the isFinite guard: no magnitude means no brightness term, not a poisoned
    // score.
    const body = e.kind === 'sun' || e.kind === 'moon' || e.kind === 'planet';
    sc += (e.kind === 'con' ? 14 : body ? 20 : 0) + (e.framed ? 12 : 0)
        - (Number.isFinite(e.mag) ? Math.max(0, e.mag)*1.1 : 0);
    out.push({ e, sc });
  }
  out.sort((a,b) => b.sc - a.sc);
  return out.slice(0, limit).map(o => o.e);
}

// What a result IS, in one word under its name. Bodies carry no constellation —
// the baker holds no boundary polygons for a moving object, so it writes an
// empty string rather than guessing which one the Moon was passing through.
// Printing that empty string would leave the row looking unfinished, so the
// kind is named instead.
function subLabel(e){
  switch (e.kind){
    case 'con':    return 'constellation';
    case 'sun':    return 'the Sun';
    case 'moon':   return 'the Moon';
    case 'planet': return 'planet';
    default:       return e.con;
  }
}

function renderResults(list){
  const box = $('res');
  if (!list.length){ box.style.display='none'; return; }
  box.style.display = '';
  box.innerHTML = list.map((e,i) =>
    `<div class="row${e.framed?'':' unreach'}" data-i="${i}">
       <span class="nm">${e.name}</span>
       <span class="sub">${subLabel(e)}</span>
       <span class="tt">${e.framed ? e.t.toFixed(1)+'s' : '—'}</span>
     </div>`).join('');
  [...box.querySelectorAll('.row')].forEach(r =>
    r.onclick = () => goTo(list[+r.dataset.i]));
}

// THE POINT OF THE WHOLE THING: typing a name moves the camera to the star.
//
// The planetarium pass sweeps the entire celestial sphere, so "where is Orion"
// always has an answer — a film-second at which the camera is looking straight
// at it. Seeking to that second IS moving the camera. Easing into it rather
// than cutting is what makes it read as a camera move instead of a jump, and it
// works identically whether the film is playing or paused.
function flyTo(v, target, done){
  cancelAnimationFrame(flyTo._h);
  const from = v.currentTime, d = target - from;
  // A short hop should not take as long as a long one, but a long one should
  // not crawl either — so the duration grows with distance and then flattens.
  const ms = Math.min(1100, 260 + Math.abs(d) * 44);
  const t0 = performance.now();
  const wasPlaying = !v.paused;
  v.pause();
  (function step(now){
    const u = Math.min(1, (now - t0) / ms);
    const e = u < 0.5 ? 4*u*u*u : 1 - Math.pow(-2*u + 2, 3)/2;   // ease in-out
    seekTo(v, from + d * e);
    draw();
    if (u < 1) flyTo._h = requestAnimationFrame(step);
    else { if (wasPlaying) v.play().catch(()=>{}); done && done(); }
  })(t0);
}

// Hold on whatever we just arrived at. Paused is the honest state for looking
// at something: the frame stays the frame it was chosen for.
function park(){ vid().pause(); setIcon($('pp'), 'play'); }

function goTo(e){
  $('res').style.display = 'none';
  $('q').value = e.name;
  $('xq').style.display = '';

  if (!e.framed){
    // Never pretend. These are the stars too faint for the render to paint at
    // all — nothing to fly to, so say so rather than move to an empty patch.
    //
    // "Too faint" is the reason for a STAR. It is not the reason for the Moon,
    // and a body carries no magnitude to quote anyway, so the honest sentence
    // there is the one that describes what actually happened: the sweep never
    // pointed at it. Reusing the star's wording would have been a small, fluent
    // lie printed under the Moon's own name.
    showCard(e, null, Number.isFinite(e.mag)
      ? `Magnitude ${e.mag.toFixed(1)} — far too faint to see, and below what this sky draws.`
      : `Never enters the frame during this film.`);
    toast(Number.isFinite(e.mag) ? `${e.name} is too faint to show`
                                 : `${e.name} is never framed in this film`);
    S.marked = null; draw();
    return;
  }

  // The index is built on the planetarium pass, so honour it: switch to that
  // cut and fly to exactly the second it names. That pass has no ground and no
  // sunlight, which is why the star is actually there when you arrive.
  //
  // AND THEN STOP. The pass pans 24° of azimuth a second, so a target that arrives
  // dead centre is out of the frame within a few seconds. Leaving the film
  // rolling after a search meant the star you asked for was centred for about
  // one blink and then gone — which reads, correctly, as "it isn't centred and
  // there are no sticks". Arriving somewhere is not the same as staying there.
  S.marked = e;
  S.look = null;
  if (!S.sunOff){ setSun(true, e.t); park(); } else flyTo(vid(), e.t, park);

  // Ask for a constellation and you get H.A. Rey's drawing of it laid over the
  // real stars — the figure that actually looks like a hunter or a bull, not a
  // bare join-the-dots. One click on the sky takes it away again.
  const shown = e.kind === 'con' ? showFigure(e.con, e.name) : (hideFigure(), false);
  showCard(e, null, e.alt < 0
    ? `${(-e.alt).toFixed(0)}° below the horizon — on the far side of the Earth from where you stood.`
    : null);
  toast(shown ? `${e.name} — tap the sky to clear the figure`
              : `${e.name} — ${e.alt >= 0 ? e.alt.toFixed(0)+'° above the horizon'
                                          : (-e.alt).toFixed(0)+'° below the horizon'}`);
  draw();
}

$('q').addEventListener('input', ev => {
  const v = ev.target.value;
  $('xq').style.display = v ? '' : 'none';
  renderResults(searchIndex(v, 9));
});
$('q').addEventListener('keydown', ev => {
  if (ev.key === 'Enter'){
    const r = searchIndex(ev.target.value, 1);
    if (r.length) goTo(r[0]);
  } else if (ev.key === 'Escape'){ clearQ(); }
});
function clearQ(){ $('q').value=''; $('xq').style.display='none';
  $('res').style.display='none'; $('info').classList.remove('on');
  S.marked = null; hideFigure(); draw(); }
$('xq').onclick = clearQ;

// ── free look ────────────────────────────────────────────────────────────────
// Drag the sky and look wherever you like. On a baked film that sounds
// impossible, and it would be if the film were a fixed camera. It isn't: the
// planetarium pass sweeps its aim across the entire celestial sphere, so the
// 1,200 frames on disk are 1,200 different directions to look FROM.
//
// The measurement that makes it work: for every direction on the whole sphere,
// the nearest baked frame aim is within 57.5° — median 16.5° — against a 60°
// half-field. So whatever you ask to look at, some frame already contains it.
// Looking around is then two things the player already does: seek to the frame
// whose aim is nearest, and pan inside that frame to bring the direction you
// asked for to the middle. Nothing is rendered, nothing new is downloaded.
//
// That is the whole planetarium, and it cost one index and a drag handler.
function aimVectors(f){
  const v = new Float64Array(f.frames*3);
  for (let i = 0; i < f.frames; i++){
    const d = dirAltaz(f.aim_az[i], f.aim_alt[i]);
    v[i*3]=d[0]; v[i*3+1]=d[1]; v[i*3+2]=d[2];
  }
  return v;
}
// The frame that looks most nearly at `d`. A flat scan over 1,200 frames, which
// is far cheaper than it sounds and keeps the data a plain array.
function bestFrame(d){
  const a = S.aim; let bi = 0, bc = -2;
  for (let i = 0; i < a.length; i += 3){
    const c = d[0]*a[i] + d[1]*a[i+1] + d[2]*a[i+2];
    if (c > bc){ bc = c; bi = i/3; }
  }
  return bi;
}
function applyLook(){
  if (!S.look || !S.sunOff) return;
  const d = dirAltaz(S.look.az, S.look.alt);
  const k = bestFrame(d);
  const v = vid();
  if (!v.paused) park();
  const t = k / S.night.fps;
  if (Math.abs(v.currentTime - t) > 0.5/S.night.fps) seekTo(v, t);
  draw();
}

let drag = null;
$('tapzone').addEventListener('pointerdown', ev => {
  if (!S.sky) return;
  drag = { x:ev.clientX, y:ev.clientY, moved:0, az:0, alt:0, live:false };
  $('tapzone').setPointerCapture(ev.pointerId);
});
$('tapzone').addEventListener('pointermove', ev => {
  if (!drag) return;
  const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
  drag.moved = Math.max(drag.moved, Math.abs(dx) + Math.abs(dy));
  if (drag.moved < 6) return;                      // still a tap, not a drag
  if (!drag.live){
    // Looking around only makes sense with the ground and the Sun gone, so the
    // first drag turns the planetarium pass on rather than refusing.
    if (!S.sunOff) setSun(true);
    const c = camNow();
    S.look = { az:c.az, alt:c.alt };
    drag.live = true; $('tapzone').style.cursor = 'grabbing';
  }
  drag.x = ev.clientX; drag.y = ev.clientY;
  // Degrees per screen pixel at the centre of a gnomonic frame, divided by
  // however far the view is currently zoomed in — so a drag moves the same
  // amount of SKY whatever the zoom, which is what the hand expects.
  const c = camNow();
  const fovc = 2 * Math.atan(Math.tan(c.fov * D2R / 2) * (S.crop || 1)) * R2D;
  const dpp = (fovc / S.Wn) / (S.s * Math.max(1, S.tz));
  S.look.alt = Math.max(-89, Math.min(89, S.look.alt + dy*dpp));
  S.look.az  = (S.look.az - dx*dpp / Math.max(0.25, Math.cos(S.look.alt*D2R)) + 360) % 360;
  applyLook();
});
// A drag must not also count as a tap. Stopping the pointerup does nothing for
// that: `click` is a separate event the browser synthesises afterwards from the
// down/up pair, and it fires whatever we do here. So the drag leaves a note, and
// the click handler below spends it. Letting the drag fall through would mean
// every time you finished steering you also named a star, or dismissed the very
// figure you had just dragged into view.
let dragged = false;
function endDrag(){
  if (!drag) return;
  dragged = drag.live; drag = null;
  $('tapzone').style.cursor = '';
}
$('tapzone').addEventListener('pointerup', endDrag);
$('tapzone').addEventListener('pointercancel', endDrag);

// ── tap to name ──────────────────────────────────────────────────────────────
// Inverts the exact camera the frame was rendered with, and only ever considers
// stars the frame actually PAINTED — the per-frame magnitude cutoff is baked in,
// so this can never name something invisible.
$('tapzone').addEventListener('click', ev => {
  if (dragged){ dragged = false; return; }         // that was steering, not a tap
  if (!S.sky) return;
  // A figure on screen owns the click — that is how it vanishes. Only a figure
  // that still WANTS to be there, though: one already fading out must not go on
  // swallowing taps for the length of its fade.
  if (S.figure && S.figure.want){ hideFigure(); return; }
  const c = camNow(), w = S.Wn, h = S.Hn;
  // getBoundingClientRect() already carries the stage's translate and scale, so
  // this stays correct while the view is centred on something and zoomed in.
  const r = ov.getBoundingClientRect();
  const x = (ev.clientX-r.left)/r.width*w, y = (ev.clientY-r.top)/r.height*h;
  const cb = cameraBasis(c.az, c.alt, c.fov);
  const R = 24 * cpx() / Math.max(1, S.tz);    // a fingertip, in screen pixels
  let best = null, bd = R*R;
  const sk = S.sky;
  for (let i = 0; i < sk.n; i++){
    if (sk.mag[i] > c.maglim) continue;
    const [az, alt] = radecToAltaz(sk.ra[i], sk.dec[i], c.lat, c.lst);
    // With the Sun on, solid ground hides everything under the horizon, so a
    // star down there cannot be what was tapped. With it off there is no ground
    // and the sub-horizon sky is genuinely on screen.
    if (!S.sunOff && alt <= 0) continue;
    const p = projectDir(dirAltaz(az, alt), cb, w, h);
    if (!p) continue;
    const d = (p[0]-x)*(p[0]-x) + (p[1]-y)*(p[1]-y);
    // Nearest wins, but a tie inside the radius goes to the brighter star —
    // otherwise a faint neighbour steals the name of the one you aimed at.
    if (d < bd || (d < R*R && best && sk.mag[i] < sk.mag[best] - 1.5)){ bd = d; best = i; }
  }
  if (best == null){ $('info').classList.remove('on'); S.marked = null; draw(); return; }
  const [az, alt] = radecToAltaz(sk.ra[best], sk.dec[best], c.lat, c.lst);
  const e = { kind:'star', name: sk.name[best] || sk.bf[best] || ('HIP '+sk.hip[best]),
              con: sk.con_list[sk.con[best]], mag: sk.mag[best],
              ra: sk.ra[best], dec: sk.dec[best], az, alt, framed:true };
  S.marked = e; showCard(e, sk.hip[best], null); draw();
});

// A disc's apparent size, in the unit that keeps it readable. The Moon is about
// 31 arcminutes; Jupiter is about 40 ARCSECONDS. One unit for both means either
// "0.5°" and "0.01°" (which reads as nothing) or "1866″" (which reads as noise),
// so the unit follows the object.
function angStr(deg){
  const m = deg * 60;
  return m >= 5 ? m.toFixed(1) + '′' : (m * 60).toFixed(1) + '″';
}

// What the card says the thing IS. Kept in one place because the search results,
// the toast and this panel must never disagree about whether Mars is a planet.
function kindStr(e){
  switch (e.kind){
    case 'con':    return 'Constellation';
    case 'sun':    return 'The Sun';
    case 'moon':   return 'The Moon';
    case 'planet': return 'Planet';
    default:       return 'Star' + (e.con ? ' · ' + e.con : '');
  }
}

// ── the tables ───────────────────────────────────────────────────────────────
// Spelling only: every number arrives from `facts.json`, which holds the
// daemon's own replies for this date and place. A field that is absent there is
// absent here — no row, never a guess.
const numStr = v => v >= 100 ? Math.round(v).toLocaleString('en-GB')
                  : v >= 10 ? v.toFixed(0) : v.toFixed(1);
const lyStr = ly => `${numStr(ly)} light-year${ly >= 0.95 && ly < 1.05 ? '' : 's'}`;
function hoursStr(h){ const m = Math.round(h * 60); return `${Math.floor(m/60)} h ${String(m%60).padStart(2,'0')} min`; }
function pushTimes(rows, o){
  if (o.always_up){ rows.push(['that day', 'never set']); return; }
  if (o.never_up){ rows.push(['that day', 'never rose']); return; }
  if (o.rise) rows.push(['rises', o.rise]);
  if (o.highest) rows.push(['highest', o.highest + (Number.isFinite(o.highest_alt_deg)
                                         ? ` · ${o.highest_alt_deg.toFixed(0)}° up` : '')]);
  if (o.set) rows.push(['sets', o.set]);
}

// The day at this place, as one card: the Sun, the dark, the Moon, the planets.
function showDay(){
  const F = S.facts; if (!F) return;
  const box = $('info'), d = F.day || {}, m = F.moon || {};
  const r = (k, v) => v ? `<dt>${k}</dt><dd>${v}</dd>` : '';
  const pl = (F.planets || []).map(p =>
    `<tr><td>${p.name}</td><td>${p.rise || '—'}</td><td>${p.set || '—'}</td></tr>`).join('');
  box.innerHTML =
    `<span class="x" onclick="document.getElementById('info').classList.remove('on')">${ICON.close}</span>
     <div class="n">The day</div>
     <div class="d">local time · ${F.tz || ''}</div>
     <dl>${r('sunrise', d.sunrise)}${r('sunset', d.sunset)}
         ${r('daylight', Number.isFinite(d.day_length_h) ? hoursStr(d.day_length_h) : '')}
         ${r('fully dark', d.dark_from && d.dark_until ? `${d.dark_from} – ${d.dark_until}` : '')}
         ${r('moonrise', m.rise)}${r('moonset', m.set)}
         ${r('moon lit', Number.isFinite(m.illuminated_pct) ? `${m.illuminated_pct.toFixed(0)}% · ${m.waxing ? 'waxing' : 'waning'}` : '')}</dl>
     ${pl ? `<table class="pt"><tr><th></th><th>rises</th><th>sets</th></tr>${pl}</table>` : ''}`;
  box.classList.add('on');
}

function showCard(e, hip, note){
  const box = $('info');
  const rows = [];
  if (e.alt != null) rows.push(['altitude', e.alt.toFixed(1)+'°']);
  if (e.az  != null) rows.push(['azimuth',  e.az.toFixed(1)+'°']);
  // Every row below is printed ONLY if the baker actually held the number.
  // The Sun and the Moon reach this pipeline with no magnitude, so their key is
  // absent and no magnitude row appears — rather than a plausible −26.7 that
  // nothing in this film ever computed.
  if (Number.isFinite(e.mag) && e.kind !== 'con') rows.push(['magnitude', e.mag.toFixed(2)]);
  if (Number.isFinite(e.ang))   rows.push(['apparent size', angStr(e.ang)]);
  if (Number.isFinite(e.illum)) rows.push(['illuminated', (e.illum*100).toFixed(0)+'%']);
  if (Number.isFinite(e.phase)) rows.push(['phase', e.phase.toFixed(0)+'° · '
                                                  + (e.waxing ? 'waxing' : 'waning')]);
  // The tables: what the daemon said about this object for this date and place.
  const F = S.facts;
  if (F){
    const h = hip || (e.kind === 'star' && +e.key) || null;
    const st = h && F.stars && F.stars[h];
    if (st){
      if (Number.isFinite(st.ly)) rows.push(['distance', lyStr(st.ly)]);
      if (st.spect) rows.push(['type', st.spect]);
      if (Number.isFinite(st.lum_sun)) rows.push(['luminosity', `${numStr(st.lum_sun)} × the Sun`]);
      pushTimes(rows, st);
    } else if (e.kind === 'planet'){
      const pl = (F.planets || []).find(p => p.name === e.name);
      if (pl) pushTimes(rows, pl);
    } else if (e.kind === 'moon' && F.moon){
      if (Number.isFinite(F.moon.distance_km)) rows.push(['distance', `${numStr(Math.round(F.moon.distance_km))} km`]);
      if (Number.isFinite(F.moon.age_days)) rows.push(['age', `${F.moon.age_days.toFixed(1)} days`]);
      pushTimes(rows, F.moon);
    } else if (e.kind === 'sun' && F.day){
      if (F.day.sunrise) rows.push(['rises', F.day.sunrise]);
      if (F.day.sunset)  rows.push(['sets', F.day.sunset]);
      if (Number.isFinite(F.day.day_length_h)) rows.push(['daylight', hoursStr(F.day.day_length_h)]);
    }
  }
  if (hip) rows.push(['HIP', hip]);
  box.innerHTML =
    `<span class="x" onclick="document.getElementById('info').classList.remove('on')">${ICON.close}</span>
     <div class="n">${e.name}</div>
     <div class="d">${kindStr(e)}</div>
     <dl>${rows.map(r => `<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join('')}</dl>
     ${note ? `<div class="note" style="padding:9px 0 0">${note}</div>` : ''}`;
  box.classList.add('on');
}

// ── overlay: figure + reticle ────────────────────────────────────────────────
// Everything below is drawn in RENDER pixels — the 1280×720 grid the baker
// projected into. The canvas is scaled once so those coordinates land on the
// right screen pixels no matter how big the window is.
function draw(){
  if (!S.film) return;
  const k = ov.width / S.Wn;                    // render px → backing-store px
  octx.setTransform(k, 0, 0, k, 0, 0);
  octx.clearRect(0, 0, S.Wn, S.Hn);
  if (!S.sky){ lockStage(null); return; }
  // Mid-switch the screen still shows the OLD cut's frame; drawing the new
  // cut's compass and reticle over it would put marks on the wrong sky.
  if (S.switching) return;

  const c = camNow(), cb = cameraBasis(c.az, c.alt, c.fov);
  const at = (ra, dec, loose) => {
    const [az, alt] = radecToAltaz(ra, dec, c.lat, c.lst);
    return projectDir(dirAltaz(az, alt), cb, S.Wn, S.Hn, loose);
  };
  compass(c, cb);

  const fg = S.figure ? drawFigure(S.figure, at) : null;
  const fc = fg && fg.c;

  const m = S.marked;
  // Where the selection currently is, in order of how well each coordinate
  // survives the film moving on:
  //
  //   · the figure's own centre of mass, when one is drawn — it is the thing
  //     actually on screen, and centring the drawing is what centring a
  //     constellation means. No coordinate is invented for it.
  //   · RA/dec, for a star: fixed to the sphere, so it tracks as the sky turns.
  //   · the seek entry's az/alt, which is only true at the frame it came from,
  //     and so is the last resort.
  const mark = () => !m ? null
        : m.ra != null ? at(m.ra, m.dec, true)
        : projectDir(dirAltaz(m.az, m.alt), cb, S.Wn, S.Hn, true);

  // The reticle marks the selection wherever it currently is — including while
  // you steer away from it, so what you picked never silently disappears.
  if (m && !fc) ring(onFrame(mark()), m.name);

  // What the VIEW centres on. Steering wins: while you are looking around, the
  // middle of the screen belongs to you, not to the last thing searched for.
  let p = null, fit = null;
  if (S.look)   p = projectDir(dirAltaz(S.look.az, S.look.alt), cb, S.Wn, S.Hn, true);
  else if (m) { p = fc || mark(); fit = fg; }
  lockStage(onFrame(p), fit);
}

// `loose` projection lets a point sit just past the edge, which is right for a
// reticle — a star one pixel outside the frame is still worth pointing at. It
// does NOT mean the camera should chase something that has left the picture
// entirely: while the film plays the sky turns, and an object that has swung off
// screen would otherwise drag the view into the black beside the frame. Past a
// tenth of a frame outside, the lock lets go and the reticle stops.
function onFrame(p){
  if (!p) return null;
  return (Math.abs(p[0]-S.Wn/2) > 0.6*S.Wn || Math.abs(p[1]-S.Hn/2) > 0.6*S.Hn) ? null : p;
}

// The Rey figure for one constellation.
//
// Drawn rather than baked in, which is the whole reason `figures.json` exists:
// burning the lines into the film would put them on every frame forever, and a
// click has to be able to make them go away. Two passes — a wide dark stroke
// underneath, the bright line on top — so the figure reads against a field of
// stars without a shadow blur, which at this canvas size costs real frames.
// Returns the figure's centre of mass on screen, which is what the view centres
// on — or null when it drew nothing.
function drawFigure(fg, at){
  const seg = fg.seg;
  fg.a += ((fg.want ? 1 : 0) - fg.a) * 0.16;    // fade in, and fade back out
  const a = fg.a;
  if (a <= 0.01){ if (!fg.want) S.figure = null; return null; }
  const pts = [];
  for (let i = 0; i < seg.length; i += 4){
    const p = at(seg[i], seg[i+1], true), q = at(seg[i+2], seg[i+3], true);
    if (p && q) pts.push(p, q);
  }
  if (!pts.length) return null;
  octx.lineCap = 'round'; octx.lineJoin = 'round';
  const q = cpx();
  for (const pass of [[5.0*q, `rgba(0,0,0,${0.42*a})`], [1.7*q, `rgba(150,205,255,${0.80*a})`]]){
    octx.lineWidth = pass[0]; octx.strokeStyle = pass[1];
    octx.beginPath();
    for (let i = 0; i < pts.length; i += 2){
      octx.moveTo(pts[i][0], pts[i][1]); octx.lineTo(pts[i+1][0], pts[i+1][1]);
    }
    octx.stroke();
  }
  // Centre of mass for the label and the camera; bounding box so the view can
  // be zoomed to actually FIT the figure. At the 120° field this pass was baked
  // at, Orion is about 210 render pixels across — a doodle in the middle of a
  // 1280-wide frame. Centring it is not the same as showing it.
  let cx = 0, cy = 0, x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (const p of pts){ cx += p[0]; cy += p[1];
    if (p[0]<x0) x0=p[0]; if (p[0]>x1) x1=p[0];
    if (p[1]<y0) y0=p[1]; if (p[1]>y1) y1=p[1]; }
  cx /= pts.length; cy /= pts.length;
  // Label under the drawing, not through it.
  const ly = Math.min(S.Hn - 12*q, y1 + 30*q);
  octx.font = `600 ${19*q}px ui-sans-serif,system-ui,sans-serif`;
  octx.textAlign = 'center';
  octx.lineWidth = 4*q; octx.strokeStyle = `rgba(0,0,0,${0.55*a})`;
  octx.strokeText(fg.name, cx, ly);
  octx.fillStyle = `rgba(190,222,255,${0.92*a})`;
  octx.fillText(fg.name, cx, ly);
  octx.textAlign = 'left';
  return { c:[cx, cy], w: x1-x0, h: y1-y0 };
}

// A figure is shown by name and dismissed by a click. `want` drives the fade in
// draw(); the object survives until the fade-out finishes so it does not blink
// off. If the constellation has no figure the caller is told, rather than a
// silent nothing appearing on screen.
function showFigure(code, name){
  const seg = S.fig && S.fig[code];
  if (!seg || !seg.length) return false;
  S.figure = { code, name, seg, a: 0, want: true };
  return true;
}
// Dismissing the figure dismisses the whole selection with it. Leaving the
// constellation marked would strand a reticle on the sky at the az/alt it held
// several seconds ago — a ring around nothing, which is worse than no ring.
function hideFigure(){
  if (!S.figure) return;
  S.figure.want = false;
  if (S.marked && S.marked.kind === 'con' && S.marked.con === S.figure.code){
    S.marked = null;
    $('info').classList.remove('on');
  }
}

// ── centring the chosen object ───────────────────────────────────────────────
// The seek index already puts the camera as near the object as the sweep ever
// gets — a median of 65 px off centre, but occasionally 380. Closing that last
// gap is a display transform, not a re-render: slide the whole stage so the
// object sits at the middle of the screen.
//
// Sliding a picture that only just covers the viewport would drag black in at
// the trailing edge, so it zooms by exactly enough to stay covered and no more.
// Solving `Wn·s·z − 2·z·|ox| ≥ Wv` for z gives the requirement below; when the
// object is already centred |ox| is 0, z falls under 1, and nothing zooms.
//
// The result is eased rather than applied, so a search reads as a camera
// settling onto its subject — and because it re-aims every frame, the lock
// holds while the film plays. That is a tracking shot, for free.
function lockStage(p, fit){
  const Wv = innerWidth, Hv = innerHeight, s = S.s;
  if (p){
    const ox = (p[0] - S.Wn/2) * s, oy = (p[1] - S.Hn/2) * s;
    const dx = S.Wn*s - 2*Math.abs(ox), dy = S.Hn*s - 2*Math.abs(oy);
    // zc is the zoom the centring itself demands — the least that keeps the
    // frame covering the viewport once it has been slid over. It is a floor,
    // never traded away, because giving it up is what lets black in.
    const zc = Math.max(1, dx > 1 ? Wv/dx : 99, dy > 1 ? Hv/dy : 99);
    let z = zc;
    // A star gets no cosmetic zoom — centring is what was asked for, and
    // upscaling the film only softens it. A figure is different: a constellation
    // filling a fiftieth of the screen has not been "shown". So when there is a
    // figure, close in until its bounding box takes about 62% of the frame —
    // but never past `zpx`, the zoom at which one video pixel would cover more
    // than one screen pixel. Past that the picture is being invented, not shown.
    const zpx = 1 / (s * (S.dpr || 1));
    if (fit && fit.w > 1 && fit.h > 1)
      z = Math.max(zc, Math.min(2.6, zpx, 0.62*Math.min(Wv/(fit.w*s), Hv/(fit.h*s))));
    // The same limit binds the centring zoom too. An object near the edge of
    // its frame would need the film enlarged past `zpx` to reach the middle;
    // it stays a little off-centre instead, ringed where it is. The pan clamp
    // below still keeps black out, so the only thing given up is dead-centring.
    z = Math.min(z, 3, Math.max(1, zpx));
    // Whatever z ended up, never pan further than the frame can cover.
    const mx = Math.max(0, (S.Wn*s*z - Wv)/2), my = Math.max(0, (S.Hn*s*z - Hv)/2);
    S.gx = Math.max(-mx, Math.min(mx, -z*ox));
    S.gy = Math.max(-my, Math.min(my, -z*oy));
    S.gz = z;
  } else { S.gx = 0; S.gy = 0; S.gz = 1; }

  const e = 0.11;                            // ≈180 ms to settle at 60 fps
  S.tx += (S.gx - S.tx)*e; S.ty += (S.gy - S.ty)*e; S.tz += (S.gz - S.tz)*e;
  if (Math.abs(S.gx-S.tx) < 0.05) S.tx = S.gx;
  if (Math.abs(S.gy-S.ty) < 0.05) S.ty = S.gy;
  if (Math.abs(S.gz-S.tz) < 0.0004) S.tz = S.gz;
  stage.style.transform =
    `translate(${S.tx.toFixed(2)}px,${S.ty.toFixed(2)}px) scale(${S.tz.toFixed(4)})`;
}

// The horizon compass — a tick and a letter where true East and true West meet
// the horizon, the same two marks the renderer used to burn into the frame. They
// are drawn here instead, as lines, so they are sharp at any size and any zoom.
// Ink follows the sky exactly as the renderer's did: white at night, black by
// day, blended as the real Sun crosses −4°…+4°, over an underlay of the
// opposite tone. The night pass has no daylight, so its ink is always white.
function compass(c, cb){
  const day = S.sunOff ? 0 : Math.max(0, Math.min(1, (c.sun + 4) / 8));
  const ink = Math.round(255 * (1 - day)), und = 255 - ink;
  const px = 1 / (ov.width / S.Wn);           // one backing-store pixel, in render px
  const u = cpx();
  for (const [az, ch] of [[90, 'E'], [270, 'W']]){
    const p = projectDir(dirAltaz(az, 0), cb, S.Wn, S.Hn);
    if (!p || p[1] < 6*u || p[1] > S.Hn - 4*u) continue;
    const [x, y] = p, gw = 7*u, gh = 9*u, tick = 9*u, gap = 3*u;
    const gx = x - gw/2, gy = y - tick - gap - gh;
    const path = () => {
      octx.beginPath();
      octx.moveTo(x, y); octx.lineTo(x, y - tick);
      if (ch === 'E'){
        octx.moveTo(gx + gw, gy); octx.lineTo(gx, gy); octx.lineTo(gx, gy + gh); octx.lineTo(gx + gw, gy + gh);
        octx.moveTo(gx, gy + gh/2); octx.lineTo(gx + gw*0.8, gy + gh/2);
      } else {
        octx.moveTo(gx, gy); octx.lineTo(gx + gw*0.25, gy + gh); octx.lineTo(gx + gw*0.5, gy + gh*0.45);
        octx.lineTo(gx + gw*0.75, gy + gh); octx.lineTo(gx + gw, gy);
      }
    };
    octx.lineJoin = 'round'; octx.lineCap = 'round';
    path(); octx.lineWidth = Math.max(3*px, 2.4*u); octx.strokeStyle = `rgba(${und},${und},${und},.45)`; octx.stroke();
    path(); octx.lineWidth = Math.max(1.2*px, 1.1*u); octx.strokeStyle = `rgba(${ink},${ink},${ink},.85)`; octx.stroke();
  }
}

// Overlay sizes are given in SCREEN pixels and converted here, so a ring, a
// label or a figure line is the same size on a phone and on a 4K monitor —
// whatever resolution the film was baked at.
const cpx = () => 1 / S.s;

function ring(p, label){
  if (!p) return;
  const q = cpx(), [x,y] = p, r = 17*q, a = 7*q, b = 2*q;
  octx.strokeStyle = 'rgba(255,212,121,.92)'; octx.lineWidth = 1.6*q;
  octx.beginPath(); octx.arc(x, y, r, 0, 7); octx.stroke();
  octx.beginPath();
  octx.moveTo(x-r-a,y); octx.lineTo(x-r-b,y); octx.moveTo(x+r+b,y); octx.lineTo(x+r+a,y);
  octx.moveTo(x,y-r-a); octx.lineTo(x,y-r-b); octx.moveTo(x,y+r+b); octx.lineTo(x,y+r+a);
  octx.stroke();
  if (label){
    octx.font = `600 ${15*q}px ui-sans-serif,system-ui,sans-serif`;
    octx.lineWidth = 3.5*q; octx.strokeStyle = 'rgba(0,0,0,.62)';
    octx.strokeText(label, x + r + 11*q, y + 5*q);
    octx.fillStyle = 'rgba(255,212,121,.95)';
    octx.fillText(label, x + r + 11*q, y + 5*q);
  }
}

// ── transport / chrome ───────────────────────────────────────────────────────
$('head').onclick = () => $('panel').classList.toggle('closed');
// Pressing play gives the film back the camera. A held look and a rolling film
// cannot both decide where the middle of the screen is: the look would seek back
// to its own frame on every tick and the film would never advance.
$('pp').onclick = ev => { ev.stopPropagation();
  const v = vid();
  if (v.paused){ S.look = null; v.play(); setIcon($('pp'), 'pause'); }
  else { v.pause(); setIcon($('pp'), 'play'); } };
$('scrub').oninput = ev => {
  S.look = null;
  const v = vid(); v.currentTime = (+ev.target.value/1000) * (v.duration || 1); draw(); };

function syncScrub(){
  const v = vid();
  if (v.duration) $('scrub').value = Math.round(v.currentTime / v.duration * 1000);
  const t = v.currentTime;
  $('clk').textContent = `${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
}
let toastT;
function toast(msg){ const el = $('toast'); el.textContent = msg; el.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2600); }

// Lay out the video's content rectangle by hand: the size `object-fit:cover`
// would have produced, stated in pixels so the overlay can share it. Everything
// drawn afterwards is in RENDER coordinates (1280×720) — the same numbers the
// baker projected with — and the browser scales them to the screen for free.
// ── screen shapes ────────────────────────────────────────────────────────────
// A square-master bake ships one cut per screen shape — landscape 16:9, phone
// portrait 9:16, tablet 4:3 and 3:4 — all centred crops of the same frames, so
// they share one clock and one camera track. The player shows the cut whose
// shape is nearest the screen's, and changes cut when the device turns: no
// black bars, and nothing cropped away beyond the few percent between a real
// screen and its nearest shape. A plain bake has no shapes and is shown as is.
function pickShape(){ return pickShapeFor(innerWidth / innerHeight); }
function pickShapeFor(aspect){
  const sh = S.film && S.film.shapes;
  if (!sh) return null;
  // A window with no size yet (a hidden tab, a prerender) has no aspect to
  // match; start in the first shape — the landscape one — and let `resize`
  // correct it the moment the window has a shape.
  if (!(aspect > 0 && isFinite(aspect))) return Object.keys(sh)[0];
  const want = Math.log(aspect);
  let best = null, bd = Infinity;
  for (const k of Object.keys(sh)){
    const d = Math.abs(Math.log(sh[k].w / sh[k].h) - want);
    if (d < bd){ bd = d; best = k; }
  }
  return best;
}

// Which encoding this browser gets. A bake may ship each cut twice — 10-bit
// HEVC, closer to the render at half the size, and H.264, which plays
// everywhere. `cuts.json` says which were shipped; the browser says what it can
// decode. Anything that cannot promise HEVC Main 10 gets H.264.
function pickCodec(list){
  if (!list || !list.length) return null;
  const probe = document.createElement('video');
  if (list.includes('hevc10') && probe.canPlayType('video/mp4; codecs="hvc1.2.4.L153.B0"')) return 'hevc10';
  return list.includes('h264') ? 'h264' : list[0];
}

// The name of one cut's file for one shape.
function cutName(base, k){ return S.codec ? `${base}_${k}.${S.codec}.mp4` : `${base}_${k}.mp4`; }

// A fresh <video> for one cut, loaded and parked on `t` before anyone sees it.
// Resolves with the element once it has a decodable frame at `t` (or after
// `ms`, so a slow network can delay a swap but never wedge it).
function stageCut(base, k, t, ms){
  const v = document.createElement('video');
  v.id = base === 'film' ? 'vFilm' : 'vNight';
  v.playsInline = true; v.loop = true; v.muted = true; v.preload = 'auto';
  v.setAttribute('playsinline', ''); v.setAttribute('loop', ''); v.setAttribute('muted', '');
  v.className = 'off';
  v.style.transition = 'none';                 // it is swapped in, not faded in
  v.setAttribute('src', cutName(base, k));
  if (base === 'film') v.poster = `poster_${k}.png`;
  armSeeks(v);
  frame.insertBefore(v, frame.firstChild);     // under the live videos
  return new Promise(res => {
    let done = false;
    const fin = () => { if (done) return; done = true; clearTimeout(h); res(v); };
    const h = setTimeout(fin, ms);
    v.addEventListener('loadedmetadata', () => { seekAndWait(v, t, ms).then(fin); }, { once:true });
    v.addEventListener('error', fin, { once:true });
  });
}

// The shape swap, double-buffered. The old code pointed both <video>s at the
// new files and let the screen go black until the metadata arrived and the
// seek landed — on a phone turning in the hand, a black hole of several
// hundred milliseconds to a few seconds at 4K. Now the cut that is ON SCREEN
// is loaded on a second element behind it, parked on the same film-second,
// and only swapped in once that frame is decodable; the hidden cut follows the
// same way afterwards. Nothing the viewer is looking at changes until its
// replacement is ready, and the moment of sky is the same on both sides of
// the swap because both cuts share one clock.
async function applyShape(k){
  if (S.pending && S.pending.k === k) return;
  const token = { k };
  S.pending = token;
  const sh = S.film.shapes[k];
  const seekIdx = load(`seek_${k}.json`);
  const first = S.sunOff ? 'night' : 'film';
  const bring = async (base) => {
    const old = base === 'film' ? vFilm : vNight;
    if (old.getAttribute('src') === cutName(base, k)) return;
    const live = old === vid();
    const nv = await stageCut(base, k, old.currentTime, 8000);
    if (S.pending !== token){ nv.remove(); return; }  // the phone turned again
    const playing = !old.paused;
    // The geometry and the element change in the same frame.
    if (live){
      S.shape = k; S.crop = sh.scale; S.Wn = sh.w; S.Hn = sh.h;
      S.seek = await seekIdx;
      if (S.pending !== token){ nv.remove(); return; }
    }
    if (base === 'film') vFilm = nv; else vNight = nv;
    if (old.classList.contains('top')) nv.classList.add('top');
    if (live){ nv.classList.remove('off'); }
    old.remove();
    old.removeAttribute('src'); old.load();        // release the old decoder
    if (live){ fit(); if (playing) nv.play().catch(()=>{}); }
    requestAnimationFrame(() => { nv.style.transition = ''; });
  };
  // The cut on screen first, and the caller waits for it. The hidden cut
  // follows on its own; a Sun switch meanwhile waits on `S.staging`.
  const second = first === 'film' ? 'night' : 'film';
  S.staging[first] = bring(first);
  await S.staging[first];
  S.staging[first] = null;
  if (S.pending !== token) return;
  S.staging[second] = bring(second).then(() => { S.staging[second] = null; });
  // A plain swap of the hidden cut, or no swap at all: the geometry still
  // follows the shape (first boot lands here).
  if (S.shape !== k){ S.shape = k; S.crop = sh.scale; S.Wn = sh.w; S.Hn = sh.h; S.seek = await seekIdx; fit(); }
  S.staging[second].then(() => { if (S.pending === token) S.pending = null; });
}

// The installed app: register the worker, then have it store — whole, once — the
// cuts THIS device will play: the shape it is held in now and the shape it
// becomes when turned, in the encoding this browser chose, both films. Nothing
// else is downloaded; a phone never stores the tablet cuts.
function installOffline(){
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  // Register now, but store the cuts only once the film that is playing has
  // buffered through (or after 20 s, whichever is first). Fetching 200 MB of
  // whole files WHILE the same film streams its first seconds made the two
  // compete for the line, and the opening stalled on slow connections.
  const buffered = new Promise(res => {
    const v = vid();
    if (v.readyState >= 4) return res();
    v.addEventListener('canplaythrough', () => res(), { once:true });
    setTimeout(res, 20000);
  });
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready)
    .then(reg => buffered.then(() => reg)).then(reg => {
    const sh = S.film && S.film.shapes;
    let files;
    if (sh){
      const here = pickShape();
      const turned = pickShapeFor(innerHeight / innerWidth);
      const name = (b, k) => S.codec ? `${b}_${k}.${S.codec}.mp4` : `${b}_${k}.mp4`;
      files = [...new Set([here, turned])].flatMap(k => [name('film', k), name('night', k)]);
    } else files = ['film.mp4', 'night.mp4'];
    reg.active && reg.active.postMessage({ type: 'save-cuts', files });
  }).catch(() => {});
}

function load(u){
  return window.EMBED ? Promise.resolve(window.EMBED[u]) : fetch(u).then(r => r.json());
}

function fit(){
  const f = side() || S.film;
  if (f && !S.shape){ S.Wn = f.w; S.Hn = f.h; }
  S.s = Math.max(innerWidth / S.Wn, innerHeight / S.Hn);
  const w = S.Wn * S.s, h = S.Hn * S.s;
  frame.style.width = w+'px'; frame.style.height = h+'px';
  // The overlay is drawn at the device's own pixel density, so a line or a
  // label is as sharp on a 3× phone as on a laptop.
  const d = Math.min(devicePixelRatio || 1, 3);
  S.dpr = d;
  ov.width = Math.round(w*d); ov.height = Math.round(h*d);
  draw();
}
addEventListener('resize', () => {
  const k = pickShape();
  if (k && k !== S.shape) applyShape(k);
  fit();
});

addEventListener('keydown', ev => {
  if (ev.target.tagName === 'INPUT') return;
  if (ev.key === ' '){ ev.preventDefault(); $('pp').click(); }
  if (ev.key.toLowerCase() === 's') setSun(!S.sunOff);
  if (ev.key.toLowerCase() === 'f') document.documentElement.requestFullscreen?.();
});

// ── the veil ─────────────────────────────────────────────────────────────────
// Where the black sheet wants to be, read off the video's own clock:
//   · 1 until the first frame of the film has been PAINTED (not merely loaded),
//     so the viewer never sees the poster give way to frame 0, or a black
//     element while a 4K first frame decodes;
//   · a dip through black across the loop point of a cut whose last frame does
//     not continue into its first. The cinematic cut ends at the next morning
//     and restarts at the birth hour — a cut, not a loop — so it closes its
//     eyes for 0.6 s each side. A pass whose sidecar says `loop_closed` (the
//     planetarium pass over one sidereal day) needs no dip and
//     gets none;
//   · 0 whenever the film is paused or being flown, so parking near the end
//     never leaves the screen dark.
// The alpha approaches its target at a bounded rate rather than snapping, so a
// pause inside the dip fades the veil away instead of blinking it off.
const VEIL = { a: 1, painted: false, D: 0.6 };
function veilTarget(){
  if (!VEIL.painted) return 1;
  if (S.switching) return VEIL.a;
  const v = vid(), f = side();
  if (!v || !f || v.paused || v.seeking) return 0;
  if (f.loop_closed) return 0;
  const L = f.loop_secs || v.duration || 0, t = v.currentTime, D = VEIL.D;
  // Fully dark 0.1 s before the wrap: the last frame and the cut itself are
  // never seen, whatever frame the decoder stops on.
  if (L && t > L - D - 0.1) return Math.min(1, (t - (L - D - 0.1)) / D);
  if (t < D) return Math.min(1, 1 - t / D);
  return 0;
}
function paintedOnce(v){
  const mark = () => { VEIL.painted = true; };
  if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(mark);
  else v.addEventListener('playing', mark, { once:true });
  v.addEventListener('error', mark, { once:true });   // never hold a black screen for a broken file
  setTimeout(mark, 12000);
}

function tick(){
  syncScrub(); draw();
  const t = vid().currentTime;
  $('cap').classList.toggle('hide', S.sunOff || t > 11);
  const want = veilTarget(), step = 0.08;
  VEIL.a += Math.max(-step, Math.min(step, want - VEIL.a));
  $('veil').style.opacity = VEIL.a < 0.002 ? 0 : VEIL.a.toFixed(3);
  requestAnimationFrame(tick);
}

// ── boot ─────────────────────────────────────────────────────────────────────
(async function boot(){
  // The five sidecars normally arrive as sibling files. `window.EMBED`, present
  // only in a SINGLE-FILE build, carries the same five objects already parsed —
  // because `fetch()` is refused on `file://`, so an offline copy the customer
  // double-clicks cannot read its own siblings. With no EMBED this is the
  // ordinary hosted path, unchanged.
  const [film, night, sky, fig] = await Promise.all(
    ['film.json','night.json','sky.json','figures.json'].map(load));
  S.film = film; S.night = night; S.sky = sky; S.fig = fig.con;
  // The tables are optional: a film baked without them simply has no day card.
  S.facts = await load('facts.json').catch(() => null);
  if (S.facts){ $('dayb').style.display = ''; $('dayb').onclick = showDay; }
  // A square master: pick this screen's shape, which also loads its search
  // index and its two cuts. A plain bake: the one index and the plain files.
  const k0 = pickShape();
  if (k0){
    const cuts = await load('cuts.json').catch(() => null);
    S.codec = pickCodec(cuts && cuts.codecs);
    await applyShape(k0);
  }
  else {
    vFilm.setAttribute('src', 'film.mp4'); vFilm.poster = 'poster.png';
    vNight.setAttribute('src', 'night.mp4');
    S.seek = await load('seek.json');
  }
  const seek = S.seek;
  // The planetarium's whole index: every baked frame's aim as a unit vector, so
  // "look here" is one dot-product sweep instead of a render. 1,200 vectors.
  S.aim = aimVectors(night);

  // English constellation names, so "the hunting dogs" can find Canes Venatici.
  for (const e of seek) if (e.kind === 'con' && e.english) CON_EN[e.con] = e.english;

  armSeeks(vFilm); armSeeks(vNight);
  paintedOnce(vFilm);
  // After the cuts are chosen, so the offline store waits on the film that
  // is actually playing (see installOffline).
  installOffline();
  fit(); tick();
  vFilm.play().catch(()=>{});
  const nfig = Object.keys(S.fig).length,
        nseg = Object.values(S.fig).reduce((a,v) => a + v.length/4, 0);
  console.log(`birthday: film ${film.frames}f/${film.loop_secs.toFixed(1)}s · `
    + `night ${night.frames}f/${night.loop_secs.toFixed(1)}s · `
    + `${seek.length} seekable objects · ${sky.n} named stars · `
    + `${nfig} figures / ${nseg} segments · render ${film.w}×${film.h}`);

  // `#Antares` opens the film already looking at Antares. It goes through the
  // ordinary search — the same ranking a typed query gets — so a link can only
  // ever name something the film actually contains, and an unknown name is
  // ignored rather than leaving the player somewhere it cannot explain.
  const fromHash = () => {
    const q = decodeURIComponent(location.hash.slice(1)).trim();
    if (!q) return;
    const r = searchIndex(q, 1);
    if (r.length) { $('q').value = r[0].name; goTo(r[0]); }
  };
  addEventListener('hashchange', fromHash);
  fromHash();
})();
</script>
</body>
</html>
